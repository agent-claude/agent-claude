client_id = "0ac709b3f7b2967506f3abe2c6c06bc0"
name = "Agent Claude"
application_url = "https://agent-claude.onrender.com"
embedded = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
scopes = "read_customers,read_fulfillments,read_orders,read_products,write_products"

[auth]
redirect_urls = [
  "https://agent-claude.onrender.com/auth/callback",
  "https://agent-claude.onrender.com/auth/shopify/callback",
  "https://agent-claude.onrender.com/api/auth/callback"
]

[build]
automatically_update_urls_on_dev = true
